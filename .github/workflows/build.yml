name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The CLI must survive being run with no device and no PixelKit project present:
      # every check reports "could not determine" rather than throwing. Exit 1 is expected here.
      - run: node build/index.js doctor || true
      - run: npm pack --dry-run
